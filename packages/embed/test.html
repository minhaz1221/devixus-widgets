<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Embed Test</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; }
    h1 { margin-bottom: 8px; }
    p { color: #666; margin-bottom: 32px; }
    .section { margin-bottom: 40px; }
    h2 { font-size: 16px; margin-bottom: 12px; color: #333; }
    code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Devixus Widgets — Embed Test</h1>
  <p>This page simulates a customer's website with a widget embedded.</p>

  <div class="section">
    <h2>WhatsApp Widget test</h2>
    <p>Replace <code>YOUR_WIDGET_ID</code> with a real widget ID from your dashboard.</p>
    <script
      src="./dist/widget.js"
      data-widget-id="YOUR_WIDGET_ID">
    </script>
  </div>

  <div class="section" id="testimonials-mount">
    <h2>Testimonials Widget test</h2>
    <script
      src="./dist/widget.js"
      data-widget-id="YOUR_WIDGET_ID_2"
      data-mount="#testimonials-mount">
    </script>
  </div>
</body>
</html>
